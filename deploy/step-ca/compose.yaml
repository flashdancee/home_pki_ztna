services:
  step-ca:
    image: smallstep/step-ca@sha256:a2b17872915c193259b75a5474c398326f41bd199f0842093e52cf4182bc8270
    container_name: step-ca
    restart: unless-stopped
    command:
      - /usr/local/bin/step-ca
      - --password-file
      - /home/step/secrets/intermediate-password.txt
      - /home/step/config/ca.json
    ports:
      - "10.0.0.8:9000:9000"
    volumes:
      - /opt/step-ca:/home/step
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - step
        - ca
        - health
        - --ca-url
        - https://10.0.0.8:9000
        - --root
        - /home/step/certs/root_ca.crt
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
